name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Select iPhone simulator
        id: simulator
        run: |
          SIMULATOR_UDID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ && /Shutdown|Booted/ { print $2; exit }')"
          if [ -z "$SIMULATOR_UDID" ]; then
            echo "No available iPhone simulator found"
            xcrun simctl list devices available
            exit 1
          fi
          xcrun simctl list devices available | grep "$SIMULATOR_UDID"
          echo "udid=$SIMULATOR_UDID" >> "$GITHUB_OUTPUT"
      # Boot the device ourselves so xcodebuild reuses it and leaves it running.
      # The Live Activity diagnostics below read the simulator's unified log,
      # which needs the device still booted after the tests.
      - name: Boot simulator
        run: |
          xcrun simctl boot '${{ steps.simulator.outputs.udid }}' || true
          xcrun simctl bootstatus '${{ steps.simulator.outputs.udid }}' -b
      - name: Build for simulator
        run: |
          xcodebuild \
            -project MuesliiOS.xcodeproj \
            -scheme Muesli \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Run unit and UI tests
        run: |
          xcodebuild \
            test \
            -project MuesliiOS.xcodeproj \
            -scheme Muesli \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}' \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      # Reported, not gated. A floor is only meaningful once there is a
      # baseline worth holding, and gating on a number nobody chose tends to
      # produce tests written to move the number. Pass --fail-under-watched to
      # scripts/coverage-summary.py once the watched files have settled.
      - name: Report code coverage
        if: always()
        run: |
          if [ ! -d TestResults.xcresult ]; then
            echo "No result bundle produced; skipping coverage report."
            exit 0
          fi
          xcrun xccov view --report --json TestResults.xcresult > coverage.json
          python3 scripts/coverage-summary.py coverage.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
          retention-days: 7

      # The Dynamic Island UI test depends on the system rendering the Live
      # Activity extension. Keep the renderer's logs and any crash reports so a
      # blank island can be traced past the screenshots.
      - name: Collect Live Activity diagnostics
        if: always() && steps.simulator.outputs.udid != ''
        run: |
          mkdir -p sim-diagnostics
          UDID='${{ steps.simulator.outputs.udid }}'
          xcrun simctl list devices | grep "$UDID" | tee sim-diagnostics/device-state.txt || true
          xcrun simctl spawn "$UDID" log show --last 15m --style compact --info --debug \
            --predicate 'process == "chronod" OR process == "liveactivitiesd" OR process BEGINSWITH "MuesliLiveActivity" OR process == "Muesli" OR subsystem BEGINSWITH "com.apple.activitykit" OR subsystem BEGINSWITH "com.apple.ActivityKit" OR subsystem BEGINSWITH "com.apple.chrono" OR (process == "SpringBoard" AND (category CONTAINS[c] "activit" OR category CONTAINS[c] "aperture" OR subsystem CONTAINS[c] "SystemAperture")) OR (process == "runningboardd" AND eventMessage CONTAINS "MuesliLiveActivity") OR eventMessage CONTAINS "MuesliLiveActivityExtension"' \
            > sim-diagnostics/live-activity.log 2>&1 || true
          wc -l sim-diagnostics/live-activity.log || true
          cp -R ~/Library/Logs/DiagnosticReports sim-diagnostics/ 2>/dev/null || true
          xcrun simctl shutdown "$UDID" || true
      - name: Upload Live Activity diagnostics
        if: always() && steps.simulator.outputs.udid != ''
        uses: actions/upload-artifact@v4
        with:
          name: sim-diagnostics
          path: sim-diagnostics
          retention-days: 7
